name: Test Driver
on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      report_name:
        required: true
        type: string
    outputs:
      passed:
        description: "Number of passed scenarios"
        value: ${{ jobs.run_maven_test.outputs.passed }}
      failed:
        description: "Number of failed scenarios"
        value: ${{ jobs.run_maven_test.outputs.failed }}

jobs:
  run_maven_test:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Cucumber Tests
        id: maven_exec
        continue-on-error: true
        run: |
          # Ensure the directory exists
          mkdir -p target/cucumber-reports
          mvn test -Dcucumber.filter.tags="${{ inputs.tags }}"

      - name: Extract Test Summary
        id: summary
        if: always()
        shell: bash
        run: |
          REPORT_PATH="target/cucumber-report/cucumber.json"
          
          if [ -f "$REPORT_PATH" ]; then
            echo "Found report at $REPORT_PATH"
          
            # 1. Extract scenario blocks and check their step statuses
            # We look for the "status" field. 
            # In Cucumber JSON, scenarios are grouped. We'll count the keyword "passed" 
            # and "failed" within the result blocks.
          
            # Note: This is a simplified count based on step results
            PASSED_STEPS=$(grep -o '"status": "passed"' "$REPORT_PATH" | wc -l || echo 0)
            FAILED_STEPS=$(grep -o '"status": "failed"' "$REPORT_PATH" | wc -l || echo 0)

            # If you want to count SCENARIOS specifically (more accurate):
            # We use jq but with a much simpler filter that avoids the iteration error
            PASSED=$(jq '[.[] | .elements[]? | select(.type=="scenario") | .steps[].result.status] | group_by(.) | .[] | select(.[0]=="passed") | length' "$REPORT_PATH" || echo 0)
            FAILED=$(jq '[.[] | .elements[]? | select(.type=="scenario") | .steps[].result.status] | group_by(.) | .[] | select(.[0]=="failed") | length' "$REPORT_PATH" || echo 0)

            # Final safety check: if jq fails, default to 0
            echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
            echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
            echo "Results -> Passed: ${PASSED:-0}, Failed: ${FAILED:-0}"
          else
            echo "Report NOT found!"
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Cucumber Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_name }}
          path: target/cucumber-report/ # Matches your Java path