name: Test Driver
on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      report_name:
        required: true
        type: string
    outputs:
      passed:
        description: "Number of passed scenarios"
        value: ${{ jobs.run_maven_test.outputs.passed }}
      failed:
        description: "Number of failed scenarios"
        value: ${{ jobs.run_maven_test.outputs.failed }}

jobs:
  run_maven_test:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Cucumber Tests
        id: maven_exec
        continue-on-error: true
        run: |
          mkdir -p target/cucumber-report
          mvn test -Dcucumber.filter.tags="${{ inputs.tags }}"

      - name: Extract Test Summary
        id: summary
        if: always()
        shell: bash
        run: |
          REPORT_PATH="target/cucumber-report/cucumber.json"
          
          if [ -f "$REPORT_PATH" ]; then
            echo "Found report at $REPORT_PATH"
          
            # SCENARIO COUNT LOGIC:
            # We filter for 'scenario' type, then check if ALL steps passed
            PASSED=$(jq '[.[] | .elements[]? | select(.type=="scenario") | select(.steps | map(.result.status == "passed") | all)] | length' "$REPORT_PATH" | tr -d '[:space:]')
          
            # We filter for 'scenario' type, then check if ANY step failed
            FAILED=$(jq '[.[] | .elements[]? | select(.type=="scenario") | select(.steps | map(.result.status == "failed") | any)] | length' "$REPORT_PATH" | tr -d '[:space:]')

            # Ensure we default to 0 if variables are empty
            VAL_P=${PASSED:-0}
            VAL_F=${FAILED:-0}

            echo "passed=$VAL_P" >> $GITHUB_OUTPUT
            echo "failed=$VAL_F" >> $GITHUB_OUTPUT
            echo "Results -> Passed: $VAL_P, Failed: $VAL_F"
          else
            echo "Report NOT found!"
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Cucumber Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_name }}
          path: target/cucumber-report/