name: Test Driver
on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      report_name:
        required: true
        type: string
    outputs:
      passed:
        description: "Number of passed scenarios"
        value: ${{ jobs.run_maven_test.outputs.passed }}
      failed:
        description: "Number of failed scenarios"
        value: ${{ jobs.run_maven_test.outputs.failed }}

jobs:
  run_maven_test:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Cucumber Tests
        id: maven_exec
        continue-on-error: true
        run: |
          # Ensure the directory exists
          mkdir -p target/cucumber-reports
          mvn test -Dcucumber.filter.tags="${{ inputs.tags }}"

      - name: Extract Test Summary
        id: summary
        if: always()
        shell: bash
        run: |
          REPORT_PATH="target/cucumber-report/cucumber.json"
          
          if [ -f "$REPORT_PATH" ]; then
            echo "Found report at $REPORT_PATH"
          
            # Use Python to parse the JSON reliably
            RESULTS=$(python3 -c "
            import json
            try:
                with open('$REPORT_PATH') as f:
                    data = json.load(f)
                passed = 0
                failed = 0
                for feature in data:
                    for element in feature.get('elements', []):
                        if element.get('type') == 'scenario':
                            # Check if all steps in the scenario passed
                            statuses = [step.get('result', {}).get('status') for step in element.get('steps', [])]
                            if all(s == 'passed' for s in statuses):
                                passed += 1
                            elif any(s == 'failed' for s in statuses):
                                failed += 1
                print(f'{passed},{failed}')
            except Exception as e:
                print('0,0')
            ")
          
            PASSED=$(echo $RESULTS | cut -d',' -f1)
            FAILED=$(echo $RESULTS | cut -d',' -f2)
          
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "Results -> Passed: $PASSED, Failed: $FAILED"
          else
            echo "Report NOT found!"
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Cucumber Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_name }}
          path: target/cucumber-report/ # Matches your Java path