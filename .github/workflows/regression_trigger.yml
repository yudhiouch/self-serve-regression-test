name: Manual Selenium Cucumber Test

on:
  # Allows manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run (e.g. @Login)'
        required: true
        default: '@Login'
      browser:
        description: 'Browser to use'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

  # Keep automatic trigger for pushes if you want (optional)
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Cucumber Tests
        # We use the ${{ github.event.inputs.tags }} to pass the UI input to Maven
        run: |
          mvn test -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@Login' }}"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/