name: Manual Selenium Cucumber Test
run-name: Regression - ${{ inputs.FEATURE }}

on:
  workflow_dispatch:
    inputs:
      FEATURE:
        description: 'Feature to test'
        required: true
        type: string
        default: "all"
      TITLE:
        description: 'The title from Slack'
        required: false
        type: string
      PD_COMMIT:
        description: 'PD Commit SHA'
        required: false
        default: 'N/A'
        type: string
      BIZ_COMMIT:
        description: 'Biz Commit SHA'
        required: false
        default: 'N/A'
        type: string
      slack_thread_url:
        description: 'The URL for the Slack thread'
        required: true
        type: string

  # Keep automatic trigger for pushes if you want (optional)
  push:
    branches: [ main ]

jobs:
  # 1. SWAP FEATURE
  test_swap:
    if: ${{ inputs.FEATURE == 'swap' }}
    uses: ./.github/workflows/test_driver.yml
    with:
      tags: '@Login-1'
      report_name: 'swap-report'

  # 2. TRANSFER OUT FEATURE
  test_transfer_out:
    if: ${{ inputs.FEATURE == 'transfer out' }}
    uses: ./.github/workflows/test_driver.yml
    with:
      tags: '@Login-2'
      report_name: 'transfer-out-report'

  # 3. TRANSFER IN FEATURE
  test_transfer_in:
    if: ${{ inputs.FEATURE == 'transfer in' }}
    uses: ./.github/workflows/test_driver.yml
    with:
      tags: '@Login-3'
      report_name: 'transfer-in-report'

  # 4. GENERAL (Runs only on 'all')
  test_general:
    if: ${{ inputs.FEATURE == 'all' }}
    uses: ./.github/workflows/test_driver.yml
    with:
      tags: '@login'
      report_name: 'general-report'

  # 4. FINAL NOTIFICATION
  notify:
    needs: [ test_swap, test_transfer_out, test_transfer_in, test_general ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Prepare Slack Data
        id: data
        run: |
          # Combine outputs from all jobs. Only the one that ran will have a value.
          P_SWAP="${{ needs.test_swap.outputs.passed }}"
          P_TRANSFER_OUT="${{ needs.test_transfer_out.outputs.passed }}"
          P_TRANSFER_IN="${{ needs.test_transfer_in.outputs.passed }}"
          
          F_SWAP="${{ needs.test_swap.outputs.failed }}"
          F_TRANSFER_OUT="${{ needs.test_transfer_out.outputs.failed }}"
          F_TRANSFER_IN="${{ needs.test_transfer_in.outputs.failed }}"
          
          # Use basic addition for the results
          TOTAL_PASSED=$(( ${P_SWAP:-0} + ${P_TRANSFER_OUT:-0} + ${P_TRANSFER_IN:-0}))
          TOTAL_FAILED=$(( ${F_SWAP:-0} + ${F_TRANSFER_OUT:-0} + ${F_TRANSFER_IN:-0}))
          
          echo "passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT

      - name: Send Slack Summary
        uses: ./.github/actions/slack-notify
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-thread-url: ${{ github.event.inputs.slack_thread_url }}
          test-result: ${{ (contains(needs.*.result, 'failure') || steps.data.outputs.failed > 0) && 'failure' || 'success' }}
          feature-name: ${{ github.event.inputs.FEATURE }}
          passed: ${{ steps.data.outputs.passed }}
          failed: ${{ steps.data.outputs.failed }}
